<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <linearGradient id="dragonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="dragonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="650" rx="16" fill="#111827" />
  
  <!-- Dragon Aura Burst -->
  <circle cx="250" cy="240" r="170" fill="#f59e0b" opacity="0.1" filter="url(#dragonGlow)" />
  <!-- Dragon Claw Energy Trails -->
  <path d="M 60,180 Q 200,80 320,120 Q 420,160 450,260" fill="none" stroke="url(#dragonGrad)" stroke-width="5" stroke-linecap="round" filter="url(#dragonGlow)" />
  <path d="M 70,220 Q 220,120 380,220" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.7" />

  <!-- Soul Fighter Silhouette -->
  <g transform="translate(140, 100)">
    <!-- Muscular Build / Stance -->
    <path d="M110,60 C70,60 50,110 30,160 C50,200 70,260 70,380 C110,360 150,360 150,380 C150,260 170,200 190,160 C170,110 150,60 110,60 Z" fill="#1f2937" stroke="#4b5563" stroke-width="2" />
    
    <!-- Dragon Head Mark / Tattoo on Chest -->
    <polygon points="110,140 90,170 110,160 130,170" fill="url(#dragonGrad)" filter="url(#dragonGlow)" />
    
    <!-- Martial Headband & Short Hair -->
    <circle cx="110" cy="85" r="30" fill="#e5e7eb" />
    <rect x="75" y="75" width="70" height="12" rx="2" fill="#ef4444" />
    <!-- Floating Headband Ribbon -->
    <path d="M75,80 C40,70 20,95 0,90" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />

    <!-- Massive Dragon Gauntlets (Heavy Fists) -->
    <!-- Left Fist with Glowing Rune -->
    <rect x="0" y="200" width="45" height="60" rx="8" fill="#374151" stroke="#f59e0b" stroke-width="3" />
    <circle cx="22" cy="230" r="12" fill="url(#dragonGrad)" filter="url(#dragonGlow)" />
    
    <!-- Right Fist Forward Punch -->
    <rect x="175" y="190" width="55" height="70" rx="10" fill="#374151" stroke="#f59e0b" stroke-width="3.5" />
    <polygon points="190,210 215,225 190,240" fill="url(#dragonGrad)" filter="url(#dragonGlow)" />
    <!-- Shockwave ring from fist -->
    <ellipse cx="205" cy="225" rx="35" ry="50" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 4" opacity="0.8" />
  </g>

  <!-- Card Info -->
  <rect x="30" y="520" width="440" height="95" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" stroke-width="1" />
  <text x="50" y="555" font-family="'Cinzel', 'Segoe UI', serif" font-size="22" font-weight="800" fill="#ffffff">QUYỀN SƯ (SOUL FIGHTER)</text>
  <text x="50" y="582" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">Bậc thầy quyền cước rồng lửa, khống chế cứng và hồi phục khí lực dồi dào.</text>
  <text x="50" y="602" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">ĐỘ KHÓ: ★★★★☆ | VAI TRÒ: BRAWLER / TANK / HEALER</text>
</svg>
