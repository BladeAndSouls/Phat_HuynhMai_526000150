<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bladeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#ffd200" />
      <stop offset="90%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <radialGradient id="goldPedestal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd200" stop-opacity="0.7" />
      <stop offset="55%" stop-color="#b45309" stop-opacity="0.25" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    <filter id="goldBloom">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Pedestal Sacred Ground -->
  <ellipse cx="300" cy="580" rx="230" ry="65" fill="url(#goldPedestal)" filter="url(#goldBloom)" />
  <ellipse cx="300" cy="580" rx="170" ry="40" stroke="#ffd200" stroke-width="2.5" fill="none" stroke-dasharray="14,6" opacity="0.9" />
  <circle cx="300" cy="580" r="110" stroke="#f59e0b" stroke-width="2" fill="none" stroke-dasharray="8,4" opacity="0.8" />

  <!-- Sacred Golden Lotus Petals & Sparkles -->
  <g fill="#ffd200" filter="url(#goldBloom)">
    <polygon points="120,490 135,465 140,500" opacity="0.8" />
    <polygon points="150,310 168,285 160,330" opacity="0.7" />
    <polygon points="460,450 480,420 470,470" opacity="0.8" />
    <polygon points="435,270 450,245 442,285" opacity="0.85" />
    <circle cx="210" cy="170" r="5" fill="#fff" />
    <circle cx="390" cy="140" r="6" fill="#fff" />
  </g>

  <!-- GOLD WEAPON: Hoàng Kim Thiên Cương Thần Kiếm -->
  <g transform="translate(300, 310)">
    
    <!-- Outer Solar Radiance Aura -->
    <path d="M 0,-255 L 36,-190 L 25,140 L 0,175 L -25,140 L -36,-190 Z" fill="#ffd200" opacity="0.3" filter="url(#goldBloom)" />

    <!-- Pure Gold Double-Edged Blade -->
    <path d="M 0,-250 L 26,-190 L 20,140 L 0,170 L -20,140 L -26,-190 Z" fill="url(#bladeGold)" stroke="#ffd200" stroke-width="2" />
    
    <!-- Left Bevel Shimmer -->
    <path d="M 0,-250 L -26,-190 L -20,140 L 0,170 Z" fill="#fef9c3" opacity="0.6" />

    <!-- Center Ridge (Thần Thánh Quang Tung) -->
    <line x1="0" y1="-240" x2="0" y2="160" stroke="#ffffff" stroke-width="3" filter="url(#goldBloom)" />

    <!-- Sacred Scripture Runes (Thiên Đạo Kim Kinh) -->
    <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.95" filter="url(#goldBloom)">
      <!-- Rune 1 -->
      <polygon points="0,-170 8,-160 0,-150 -8,-160" />
      <line x1="0" y1="-150" x2="0" y2="-130" />
      <!-- Rune 2 -->
      <circle cx="0" cy="-105" r="7" />
      <line x1="-7" y1="-105" x2="7" y2="-105" />
      <line x1="0" y1="-98" x2="0" y2="-80" />
      <!-- Rune 3 -->
      <polygon points="0,-55 7,-45 -7,-45" />
      <line x1="0" y1="-45" x2="0" y2="-25" />
      <!-- Rune 4 -->
      <circle cx="0" cy="0" r="8" />
      <polygon points="0,-6 5,0 0,6 -5,0" fill="#fff" />
      <line x1="0" y1="8" x2="0" y2="28" />
      <!-- Rune 5 -->
      <polygon points="-6,50 6,50 0,60" />
      <line x1="0" y1="60" x2="0" y2="80" />
    </g>

    <!-- Imperial Winged Crossguard (Kim Bằng Thiên Hộ Thủ) -->
    <g transform="translate(0, 168)">
      <!-- Golden Wing Spans -->
      <path d="M 0,-5 C 45,-30 85,-45 118,-20 C 95,-5 60,15 0,22 C -60,15 -95,-5 -118,-20 C -85,-45 -45,-30 0,-5 Z" fill="#78350f" stroke="#ffd200" stroke-width="3" />
      <path d="M 0,0 C 40,-20 75,-30 95,-12 C 75,-2 45,10 0,15 C -45,10 -75,-2 -95,-12 C -75,-30 -40,-20 0,0 Z" fill="#ffd200" />
      
      <!-- Central Sun Core Jewel -->
      <circle cx="0" cy="5" r="16" fill="url(#sunCore)" filter="url(#goldBloom)" />
      <circle cx="0" cy="5" r="7" fill="#ffffff" />
    </g>

    <!-- Imperial Hilt (Chuôi Kiếm Khảm Ngọc Hoàng Đế) -->
    <g transform="translate(0, 190)">
      <rect x="-9" y="0" width="18" height="80" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="2" />
      <!-- Gold Wire Ribbons -->
      <line x1="-9" y1="15" x2="9" y2="25" stroke="#ffd200" stroke-width="2.5" />
      <line x1="9" y1="15" x2="-9" y2="25" stroke="#ffd200" stroke-width="2.5" />
      <line x1="-9" y1="35" x2="9" y2="45" stroke="#ffd200" stroke-width="2.5" />
      <line x1="9" y1="35" x2="-9" y2="45" stroke="#ffd200" stroke-width="2.5" />
      <line x1="-9" y1="55" x2="9" y2="65" stroke="#ffd200" stroke-width="2.5" />
      <line x1="9" y1="55" x2="-9" y2="65" stroke="#ffd200" stroke-width="2.5" />
    </g>

    <!-- Pommel with Imperial Crown (Vương Miện Thiên Đế Đốc Kiếm) -->
    <g transform="translate(0, 270)">
      <!-- Crown Shape -->
      <polygon points="-16,0 -20,18 0,26 20,18 16,0 8,10 0,0 -8,10" fill="#ffd200" stroke="#b45309" stroke-width="2" />
      <circle cx="0" cy="14" r="6" fill="#ffffff" filter="url(#goldBloom)" />
      
      <!-- Golden Light Ray Tassel -->
      <path d="M 0,26 Q 18,60 8,110 Q -2,140 12,175" stroke="#ffd200" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <path d="M 0,26 Q -15,65 -5,115 Q 10,145 0,180" stroke="#fef08a" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>

  </g>

  <!-- Weapon Specs Tag -->
  <g transform="translate(50, 40)">
    <rect width="230" height="38" rx="8" fill="rgba(30, 20, 5, 0.9)" stroke="#ffd200" stroke-width="1.5" />
    <text x="18" y="24" font-family="'Cinzel', serif" font-size="13" font-weight="900" fill="#fef9c3">HOÀNG KIM THIÊN CƯƠNG KIẾM</text>
  </g>
  <g transform="translate(420, 40)">
    <rect width="130" height="38" rx="8" fill="rgba(30, 20, 5, 0.9)" stroke="#ffd200" stroke-width="1.5" />
    <text x="16" y="24" font-family="'Cinzel', serif" font-size="13" font-weight="800" fill="#f59e0b">THẦN PHẨM SSS</text>
  </g>
</svg>