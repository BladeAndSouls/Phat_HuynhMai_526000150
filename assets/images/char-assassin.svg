<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="650" rx="16" fill="#0b0f19" />

  <!-- Shadow Mist / Fog Effect -->
  <circle cx="250" cy="240" r="160" fill="#a855f7" opacity="0.12" filter="url(#purpleGlow)" />
  <path d="M 50,300 Q 150,200 250,250 T 450,200" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.3" filter="url(#purpleGlow)" />
  
  <!-- Shuriken Stars in background -->
  <polygon points="380,100 390,115 410,115 395,125 400,145 385,133 370,145 375,125 360,115 380,115" fill="#ec4899" opacity="0.6" filter="url(#purpleGlow)" />
  <polygon points="100,160 107,170 120,170 110,178 113,190 103,182 93,190 97,178 87,170 100,170" fill="#a855f7" opacity="0.5" />

  <!-- Assassin Ninja Silhouette -->
  <g transform="translate(150, 110)">
    <!-- Stealth Cloak -->
    <path d="M100,80 C60,130 30,220 10,360 C70,330 130,330 190,360 C170,220 140,130 100,80 Z" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <!-- Hood & Glowing Eyes -->
    <path d="M100,40 C65,40 70,100 80,120 C100,135 100,135 120,120 C130,100 135,40 100,40 Z" fill="#09090b" stroke="#a855f7" stroke-width="1.5" />
    <!-- Glowing Eye slits -->
    <ellipse cx="88" cy="95" rx="6" ry="2" fill="#ec4899" filter="url(#purpleGlow)" />
    <ellipse cx="112" cy="95" rx="6" ry="2" fill="#ec4899" filter="url(#purpleGlow)" />

    <!-- Leather Armour & Belts -->
    <polygon points="100,120 70,140 60,190 100,205 140,190 130,140" fill="#27272a" stroke="#a855f7" stroke-width="1.5" />
    
    <!-- Dual Daggers (Kukri style) -->
    <!-- Left Hand Dagger -->
    <path d="M50,180 L20,150 L5,120 C25,135 45,155 55,185 Z" fill="#e4e4e7" stroke="#ec4899" stroke-width="2" filter="url(#purpleGlow)" />
    <!-- Right Hand Dagger -->
    <path d="M150,180 L180,150 L195,120 C175,135 155,155 145,185 Z" fill="#e4e4e7" stroke="#ec4899" stroke-width="2" filter="url(#purpleGlow)" />

    <!-- Smoke trails from blades -->
    <path d="M5,120 Q -20,80 30,60" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.7" />
    <path d="M195,120 Q 220,80 170,60" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.7" />
  </g>

  <!-- Card Info -->
  <rect x="30" y="520" width="440" height="95" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" stroke-width="1" />
  <text x="50" y="555" font-family="'Cinzel', 'Segoe UI', serif" font-size="22" font-weight="800" fill="#ffffff">SÁT THỦ (ASSASSIN)</text>
  <text x="50" y="582" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">Bậc thầy tàng hình, bẫy độc, hoán đổi vị trí và ám sát chớp nhoáng.</text>
  <text x="50" y="602" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ec4899">ĐỘ KHÓ: ★★★★★ | VAI TRÒ: BURST DPS / STEALTH</text>
</svg>
