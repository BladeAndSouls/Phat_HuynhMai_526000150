<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="heroCoreGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#06080e" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="portalGlow" cx="50%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#7f00ff" stop-opacity="0.15" />
      <stop offset="80%" stop-color="#06080e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#7f00ff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Cosmic Base -->
  <rect width="1920" height="1080" fill="url(#heroCoreGlow)" />
  <rect width="1920" height="1080" fill="url(#portalGlow)" />

  <!-- Hexagonal Grid / Ancient Array Floor -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1" fill="none">
    <polygon points="960,100 1060,160 1060,280 960,340 860,280 860,160" />
    <polygon points="960,20 1140,120 1140,320 960,420 780,320 780,120" stroke-width="1.5" stroke-dasharray="12 6" />
    <polygon points="960,-60 1220,90 1220,390 960,540 700,390 700,90" stroke-width="1" />
  </g>

  <!-- Mountain Silhouettes in Horizon -->
  <path d="M 0,850 L 300,680 L 550,780 L 800,620 L 1050,750 L 1350,590 L 1650,720 L 1920,640 L 1920,1080 L 0,1080 Z" fill="#090d16" opacity="0.7" />
  <path d="M 0,920 L 400,820 L 750,910 L 1100,800 L 1500,880 L 1920,810 L 1920,1080 L 0,1080 Z" fill="#04060a" opacity="0.95" />

  <!-- Diagonal Energy Blade Beams -->
  <line x1="200" y1="1080" x2="1400" y2="0" stroke="#00f2fe" stroke-width="1.5" opacity="0.15" />
  <line x1="500" y1="1080" x2="1700" y2="0" stroke="#a855f7" stroke-width="1" opacity="0.2" />
  
  <!-- Glowing Embers & Stars -->
  <g fill="#00f2fe" opacity="0.6">
    <circle cx="340" cy="220" r="2" />
    <circle cx="580" cy="180" r="1.5" />
    <circle cx="820" cy="290" r="3" />
    <circle cx="1120" cy="140" r="2.5" />
    <circle cx="1450" cy="260" r="1.5" />
    <circle cx="1680" cy="190" r="2" />
  </g>
  <g fill="#ffd200" opacity="0.5">
    <circle cx="450" cy="380" r="2" />
    <circle cx="760" cy="160" r="2" />
    <circle cx="1280" cy="320" r="2.5" />
    <circle cx="1520" cy="410" r="1.5" />
  </g>
</svg>
