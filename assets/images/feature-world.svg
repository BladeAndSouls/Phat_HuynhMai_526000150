<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#3a506b" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5bc0be" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6fffe9" stop-opacity="0.05" />
    </linearGradient>
    <filter id="windGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#skyGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Glowing Celestial Moon / Portal -->
  <circle cx="480" cy="110" r="65" fill="#f8fafc" opacity="0.9" filter="url(#windGlow)" />
  <circle cx="480" cy="110" r="90" fill="none" stroke="#6fffe9" stroke-width="2" stroke-dasharray="12 8" opacity="0.5" />

  <!-- Floating Sky Islands / Peaks -->
  <!-- Distant Peak -->
  <polygon points="120,240 220,130 300,240" fill="#1c2541" opacity="0.8" />
  <polygon points="350,260 420,180 500,260" fill="#1c2541" opacity="0.7" />
  
  <!-- Main Floating Island -->
  <path d="M 160,260 Q 280,240 400,260 Q 320,350 240,360 Z" fill="#0b132b" stroke="#5bc0be" stroke-width="1.5" />
  <!-- Ancient Temple Shrine on Island -->
  <polygon points="260,240 280,210 300,240" fill="#5bc0be" opacity="0.8" />
  <rect x="275" y="240" width="10" height="18" fill="#6fffe9" />

  <!-- Windwalking Aerial Glide Ribbon Trails -->
  <path d="M 50,140 C 180,80 250,210 450,150" fill="none" stroke="#6fffe9" stroke-width="4" stroke-linecap="round" filter="url(#windGlow)" />
  <path d="M 70,165 C 190,110 270,225 480,175" fill="none" stroke="#5bc0be" stroke-width="2" opacity="0.7" />

  <!-- Gliding Character Silhouette -->
  <g transform="translate(420, 140)">
    <circle cx="15" cy="0" r="4" fill="#fff" />
    <polygon points="15,4 8,18 22,18" fill="#fff" />
    <line x1="0" y1="12" x2="30" y2="12" stroke="#6fffe9" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Tag Pill -->
  <rect x="30" y="30" width="180" height="32" rx="16" fill="rgba(111, 255, 233, 0.15)" stroke="#6fffe9" stroke-width="1" />
  <text x="50" y="51" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#6fffe9">KHINH CÔNG TỰ DO</text>
</svg>
