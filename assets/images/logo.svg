<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="400" height="90">
  <defs>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd200" />
      <stop offset="100%" stop-color="#f7971e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(10, 10)">
    <!-- Shield / Aura -->
    <polygon points="35,5 65,18 65,52 35,68 5,52 5,18" fill="rgba(15,23,42,0.8)" stroke="url(#bladeGrad)" stroke-width="2.5" />
    
    <!-- Crossed Blades -->
    <path d="M15,55 L55,15 M55,15 L50,15 L55,20 Z" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M55,55 L15,15 M15,15 L20,15 L15,20 Z" stroke="url(#bladeGrad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Center Crystal -->
    <polygon points="35,22 43,35 35,48 27,35" fill="url(#bladeGrad)" filter="url(#glow)" />
    
    <!-- Dragon Wing Accents -->
    <path d="M8,30 C2,22 10,12 20,14 C12,18 12,28 8,30 Z" fill="#00f2fe" opacity="0.8" />
    <path d="M62,30 C68,22 60,12 50,14 C58,18 58,28 62,30 Z" fill="#7f00ff" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="90" y="42" font-family="'Cinzel', 'Montserrat', 'Segoe UI', serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="4">
    BLADE &amp; SOUL
  </text>
  <text x="92" y="66" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="url(#goldGrad)" letter-spacing="8">
    AWAKENING
  </text>
  <circle cx="270" cy="62" r="3" fill="#00f2fe" filter="url(#glow)" />
</svg>
