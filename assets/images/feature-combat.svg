<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="combGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="cBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#combGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Cyber / Speed Lines -->
  <line x1="50" y1="80" x2="550" y2="40" stroke="#00f2fe" stroke-width="1" opacity="0.2" />
  <line x1="20" y1="180" x2="580" y2="140" stroke="#00f2fe" stroke-width="1.5" opacity="0.3" />
  <line x1="80" y1="300" x2="520" y2="270" stroke="#38bdf8" stroke-width="1" opacity="0.2" />

  <!-- Diagonal Blade Slashes -->
  <path d="M 80,320 L 480,60" stroke="url(#neonCyan)" stroke-width="7" stroke-linecap="round" filter="url(#cBloom)" />
  <path d="M 140,350 L 520,100" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 220,50 L 400,340" stroke="#ec4899" stroke-width="4" stroke-linecap="round" filter="url(#cBloom)" />

  <!-- Hit Impact Sparks -->
  <circle cx="340" cy="170" r="15" fill="#fff" filter="url(#cBloom)" />
  <polygon points="340,130 346,164 380,170 346,176 340,210 334,176 300,170 334,164" fill="#ffd200" filter="url(#cBloom)" />

  <!-- Combo Counter Overlay -->
  <g transform="translate(420, 260)">
    <rect width="150" height="80" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#00f2fe" stroke-width="1.5" />
    <text x="18" y="32" font-family="'Cinzel', 'Segoe UI', serif" font-size="14" font-weight="bold" fill="#94a3b8">COMBO HIT</text>
    <text x="16" y="68" font-family="'Segoe UI', sans-serif" font-size="36" font-weight="900" fill="#00f2fe">999<tspan font-size="20" fill="#f59e0b">+</tspan></text>
  </g>

  <!-- Tag Pill -->
  <rect x="30" y="30" width="160" height="32" rx="16" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="1" />
  <text x="50" y="51" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#00f2fe">DYNAMIC COMBAT</text>
</svg>
